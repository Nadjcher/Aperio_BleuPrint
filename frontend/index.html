<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#060910" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Aperio — vos projets, pilotés par l'IA</title>
    <meta
      name="description"
      content="Aperio détecte les signaux faibles de vos projets en continu et déploie des agents autonomes qui diagnostiquent, planifient et rendent compte."
    />
    <!-- Partage (Open Graph / Twitter) : remplacez le domaine par le vôtre en prod -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Aperio — vos projets, pilotés par l'IA" />
    <meta
      property="og:description"
      content="Détection d'anomalies en continu et 4 agents autonomes qui diagnostiquent, planifient et rendent compte."
    />
    <meta property="og:image" content="/aperio-hero.png" />
    <meta property="og:image:width" content="1920" />
    <meta property="og:image:height" content="600" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Aperio — vos projets, pilotés par l'IA" />
    <meta
      name="twitter:description"
      content="Détection d'anomalies en continu et 4 agents autonomes qui diagnostiquent, planifient et rendent compte."
    />
    <meta name="twitter:image" content="/aperio-hero.png" />
    <!-- Données structurées (aide les moteurs et agents IA à comprendre le site) -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "SoftwareApplication",
        "name": "Aperio",
        "applicationCategory": "BusinessApplication",
        "operatingSystem": "Web",
        "description": "Outil de gestion de projet prédictif et agentique : détection de signaux faibles et agents autonomes qui diagnostiquent, planifient et rendent compte.",
        "inLanguage": "fr",
        "offers": { "@type": "Offer", "price": "0", "priceCurrency": "EUR" }
      }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

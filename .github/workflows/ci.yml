name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      - name: Build shared
        run: npm run -w shared build

      - name: Typecheck & build backend
        run: npm run -w backend build

      - name: Build frontend
        run: npm run -w frontend build

      - name: Test
        run: npm test

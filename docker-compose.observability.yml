# Stack d'observabilité Aperio : Prometheus (scrape + règles) + Alertmanager
# + Grafana (dashboards provisionnés). À lancer À CÔTÉ de docker-compose.prod.yml,
# sur le même réseau Docker, pour scraper `backend` et `worker` par leur nom :
#
#   docker compose -f docker-compose.prod.yml -f docker-compose.observability.yml \
#     --env-file .env.production up -d
#
# Grafana : http://localhost:3000 (admin / ${GRAFANA_PASSWORD:-admin})
# Prometheus : http://localhost:9090   Alertmanager : http://localhost:9093
services:
  prometheus:
    image: prom/prometheus:v2.54.1
    restart: unless-stopped
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./deploy/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - promdata:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=15d
    ports:
      - "9090:9090"

  alertmanager:
    image: prom/alertmanager:v0.27.0
    restart: unless-stopped
    volumes:
      - ./deploy/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
    ports:
      - "9093:9093"

  grafana:
    image: grafana/grafana:11.2.0
    restart: unless-stopped
    depends_on:
      - prometheus
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafanadata:/var/lib/grafana
    ports:
      - "3000:3000"

volumes:
  promdata:
  grafanadata:

# Alertmanager — routage des alertes. Remplacer le receiver par votre canal
# (Slack, PagerDuty, email…). Exemple Slack via webhook ci-dessous.
route:
  receiver: default
  group_by: ["alertname", "component"]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  routes:
    - matchers: ['severity="critical"']
      receiver: default
      repeat_interval: 1h

receivers:
  - name: default
    # Décommenter et renseigner pour activer Slack :
    # slack_configs:
    #   - api_url: ${SLACK_WEBHOOK_URL}
    #     channel: "#aperio-alerts"
    #     send_resolved: true
    #     title: "{{ .CommonAnnotations.summary }}"
    #     text: "{{ range .Alerts }}{{ .Annotations.description }}\n{{ end }}"

inhibit_rules:
  # Une cible down masque ses alertes de latence/mémoire (bruit inutile).
  - source_matchers: ['alertname="TargetDown"']
    target_matchers: ['severity=~"warning|critical"']
    equal: ["component"]

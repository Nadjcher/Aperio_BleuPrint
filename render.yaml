# Render Blueprint — API Aperio (base de données : Neon, externe).
# Déploiement : Render Dashboard → New → Blueprint → connecter ce repo.
#
# NOTE PLAN GRATUIT : les « Background Workers » Render sont payants. Sur le plan
# gratuit, le worker tourne DANS l'API (même process) via WORKER_ENABLED=true :
# l'API sert le HTTP ET dépile les jobs. Pour scaler (worker dédié), passer à un
# plan payant et rétablir un service `type: worker` (voir docker-compose.prod.yml
# ou fly.toml pour la topologie à worker séparé).
#
# Le frontend est déployé séparément sur Vercel (voir vercel.json).
services:
  # ─── API (web) — sert le HTTP et dépile les jobs en process ─────────────────
  - type: web
    name: aperio-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "4000"
      - key: RUN_MIGRATIONS
        value: "true" # l'API applique les migrations au boot
      - key: WORKER_ENABLED
        value: "true" # worker intégré (plan gratuit : pas de service dédié)
      - key: DATABASE_SSL
        value: "true" # Neon exige SSL
      - key: DATABASE_URL
        sync: false # chaîne de connexion Neon (…?sslmode=require)
      - key: CORS_ORIGIN
        sync: false # URL publique du frontend Vercel (https://…)
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: FIELD_ENCRYPTION_KEY
        sync: false # openssl rand -hex 32
      - key: GITHUB_TOKEN
        sync: false
      - key: LLM_PROVIDER
        value: none
      - key: METRICS_TOKEN
        sync: false # protège /metrics (optionnel mais recommandé)
